# Тесты на каждый PR и push в main; сборка Shepot.exe и релиз на тег vX.Y.Z.
#
#   git tag v1.3.0 && git push origin v1.3.0
#
# Описание релиза берётся из docs/releases/<тег>.md, если файл есть.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"           # консоль раннера в cp1252: без этого падает первый же print по-русски

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check shepot tests tools
      - run: python -m pytest -q tests

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller pillow   # pillow — иконка .ico в make_icon.py

      - name: Версия в коде совпадает с тегом
        shell: bash
        run: |
          code=$(python -c "import shepot; print(shepot.__version__)")
          [ "v$code" = "$GITHUB_REF_NAME" ] || { echo "shepot.__version__ = $code, тег $GITHUB_REF_NAME"; exit 1; }

      - run: python tools/build_exe.py

      - name: Архив
        run: python -c "import shutil; shutil.make_archive('Shepot-windows-x64', 'zip', 'dist', 'Shepot')"

      - name: Релиз
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then flag=(--notes-file "$notes"); else flag=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" Shepot-windows-x64.zip \
            --title "Шёпот ${GITHUB_REF_NAME#v}" "${flag[@]}"
